# delta=0.03125 (grid side ~71). This OOMed on a 24GB RTX 3090: one GMP grid
# tensor alone is 32 x 71^3 x 128 x 4B ~= 5.9GB, before conv output, gradients
# and per-block retention. Retried here on an 80GB A100.
#
# A100 jobs request nvidia.com/a100 (not the generic nvidia.com/gpu) and must
# NOT carry the 3090/4090 product affinity. No nautilus.io/issue or
# nautilus.io/reservation tolerations: those taints mark known-bad or reserved
# hardware.
apiVersion: batch/v1
kind: Job
metadata:
  name: phatjet-sonn-s-d31-gmpon-morton-p32-s0-a100
  namespace: cms-ml
  labels:
    jobgroup: phatjet-sonn
    phase: "aext"
spec:
  parallelism: 1
  completions: 1
  backoffLimit: 1
  template:
    metadata:
      labels:
        jobgroup: phatjet-sonn
        phase: "aext"
    spec:
      restartPolicy: Never
      initContainers:
      - name: init-clone-repo
        image: alpine/git
        command: ["/bin/sh", "-c"]
        args:
        - |
          git clone --no-checkout https://github.com/JavierZhao/PHAT-JeT-scanobjectnn.git /opt/repo/PHAT-JeT && \
          cd /opt/repo/PHAT-JeT && \
          git checkout c17d8f0e6781e8ba44c5a3a53f1827c2bee70539 && \
          chown -R 1000:1000 /opt/repo/PHAT-JeT
        volumeMounts:
        - name: git-repo
          mountPath: /opt/repo
        resources:
          requests: {cpu: '1', memory: 1Gi}
          limits: {cpu: '1', memory: 1Gi}
      containers:
      - name: train
        image: gitlab-registry.nrp-nautilus.io/jmduarte/hbb_interaction_network@sha256:d876f8329b3345f2086e6cb6f70a3811810acdc87b40b6f15ee90c73b281ad1d
        command: ["/bin/bash", "-c"]
        args:
        - |
          cd /opt/repo/PHAT-JeT && \
          python scripts/train_scanobjectnn.py \
            --data_dir /j-jepa-vol/scanobjectnn/main_split \
            --out /j-jepa-vol/phatjet-sonn/runs/phatjet-sonn-s-d31-gmpon-morton-p32-s0-a100 \
            --config S \
            --delta 0.03125 \
            --gmp on \
            --ordering morton \
            --patch_size 32 \
            --seed 0
        env:
        - name: GIT_SHA
          value: "c17d8f0e6781e8ba44c5a3a53f1827c2bee70539"
        - name: IMAGE_DIGEST
          value: "gitlab-registry.nrp-nautilus.io/jmduarte/hbb_interaction_network@sha256:d876f8329b3345f2086e6cb6f70a3811810acdc87b40b6f15ee90c73b281ad1d"
        volumeMounts:
        - name: git-repo
          mountPath: /opt/repo
        - name: j-jepa-vol
          mountPath: /j-jepa-vol
        resources:
          requests: {cpu: '4', memory: 32Gi, nvidia.com/a100: 1}
          limits: {cpu: '4', memory: 32Gi, nvidia.com/a100: 1}
      volumes:
      - name: git-repo
        emptyDir: {}
      - name: j-jepa-vol
        persistentVolumeClaim:
          claimName: j-jepa-vol
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
