apiVersion: batch/v1
kind: Job
metadata:
  name: combo-s-s2
  namespace: cms-ml
  labels:
    jobgroup: phatjet-sonn
    phase: "gap"
spec:
  parallelism: 1
  completions: 1
  # 4, not 1. The plan chose 1 to fail fast, but the observed failure mode is
  # node taint eviction (cluster maintenance), not code error -- five jobs died
  # that way in one batch. Retries are now safe because train_scanobjectnn.py
  # archives a previous attempt's metrics.json instead of overwriting it.
  backoffLimit: 4
  template:
    metadata:
      labels:
        jobgroup: phatjet-sonn
        phase: "gap"
    spec:
      restartPolicy: Never
      initContainers:
      - name: init-clone-repo
        image: alpine/git
        command: ["/bin/sh", "-c"]
        args:
        - |
          git clone --no-checkout https://github.com/JavierZhao/PHAT-JeT-scanobjectnn.git /opt/repo/PHAT-JeT && \
          cd /opt/repo/PHAT-JeT && \
          git checkout 94afe8e79a7ea277914d8d3ba9617dd0c4950d1f && \
          chown -R 1000:1000 /opt/repo/PHAT-JeT
        volumeMounts:
        - name: git-repo
          mountPath: /opt/repo
        resources:
          requests: {cpu: '1', memory: 1Gi}
          limits: {cpu: '1', memory: 1Gi}
      containers:
      - name: train
        image: gitlab-registry.nrp-nautilus.io/jmduarte/hbb_interaction_network@sha256:d876f8329b3345f2086e6cb6f70a3811810acdc87b40b6f15ee90c73b281ad1d
        command: ["/bin/bash", "-c"]
        args:
        - |
          cd /opt/repo/PHAT-JeT && \
          python scripts/train_scanobjectnn.py \
            --data_dir /j-jepa-vol/scanobjectnn/main_split \
            --out /j-jepa-vol/phatjet-sonn/runs/combo-s-s2 \
            --config S \
            --delta 0.09375 \
            --gmp on \
            --ordering morton \
            --patch_size 32 \
            --recipe pointnext \
            --height_mode xyz_shifted \
            --gmp_variant sparse_mean \
            --seed 2
        env:
        - name: GIT_SHA
          value: "94afe8e79a7ea277914d8d3ba9617dd0c4950d1f"
        - name: IMAGE_DIGEST
          value: "gitlab-registry.nrp-nautilus.io/jmduarte/hbb_interaction_network@sha256:d876f8329b3345f2086e6cb6f70a3811810acdc87b40b6f15ee90c73b281ad1d"
        volumeMounts:
        - name: git-repo
          mountPath: /opt/repo
        - name: j-jepa-vol
          mountPath: /j-jepa-vol
        resources:
          requests: {cpu: '4', memory: 32Gi, nvidia.com/gpu: 1}
          limits: {cpu: '4', memory: 32Gi, nvidia.com/gpu: 1}
      volumes:
      - name: git-repo
        emptyDir: {}
      - name: j-jepa-vol
        persistentVolumeClaim:
          claimName: j-jepa-vol
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values:
                - NVIDIA-GeForce-RTX-3090
                - NVIDIA-GeForce-RTX-4090
